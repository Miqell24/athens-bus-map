<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athens Public Transport — interactive map</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <h1>Athens<br>Public Transport</h1>
  <ul class="legend">
    <li><label><input type="checkbox" id="toggle-bus" checked> <span class="sw line"></span> Bus &amp; trolleybus routes</label></li>
    <li class="sublegend"><span class="mini" style="background:#149a3f"></span>trolleybus · dashed = shared with buses</li>
    <li><label><input type="checkbox" id="toggle-tram" checked> <span class="sw line tram"></span> Metro &amp; tram routes</label></li>
    <li class="sublegend"><span class="mini" style="background:#009550"></span>M1 <span class="mini" style="background:#e30613"></span>M2 <span class="mini" style="background:#1e9cd7"></span>M3 <span class="mini" style="background:#7d2b8b"></span>Tram T6/T7</li>
    <li><span class="sw stop"></span> Stop</li>
    <li><span class="sw terminus"></span> Terminus</li>
  </ul>
  <details class="lines">
    <summary>All lines <span id="count"></span></summary>
    <p class="hint">Click a line to show its route and stops.</p>
    <div id="chips" class="chip-cloud"></div>
  </details>
  <button id="export-png" title="Renders the current view as a large, print-quality PNG — street and stop names become legible as you zoom into the image">Export view as PNG</button>
  <div id="footer">Data: GTFS OASA (data.gov.gr) · <span id="stamp"></span></div>
  <label class="debug"><input type="checkbox" id="toggle-shape"> show raw GTFS shapes (QA)</label>
</aside>
<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
